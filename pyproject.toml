[project]
name = "fundabot"
version = "0.1.0"
description = "Sourced, deterministic fundamental analysis with persona agents"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pandas>=2.2",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "httpx>=0.27",
    "edgartools>=4",
    "yfinance>=0.2.50",
    "tiktoken>=0.8",
    "openai>=1.50",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "markdown>=3.7",
    "google-genai>=1.0",
    "fastapi>=0.150.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
fundabot = "fundabot.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fundabot"]

[tool.pytest.ini_options]
markers = ["db: needs a reachable Postgres at DATABASE_URL"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]
