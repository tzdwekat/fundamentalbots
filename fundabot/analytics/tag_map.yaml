# Base line item -> ordered us-gaap tags. First tag with annual data wins for the whole series.
revenue: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues, SalesRevenueNet]
cost_of_revenue: [CostOfRevenue, CostOfGoodsAndServicesSold, CostOfGoodsSold]
gross_profit: [GrossProfit]
operating_income: [OperatingIncomeLoss]
pretax_income: [IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments]
income_tax: [IncomeTaxExpenseBenefit]
net_income: [NetIncomeLoss, ProfitLoss]
eps_diluted: [EarningsPerShareDiluted]
ocf: [NetCashProvidedByUsedInOperatingActivities]
capex: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets]
da: [DepreciationDepletionAndAmortization, DepreciationAndAmortization, DepreciationAmortizationAndAccretionNet]
# fallback when D&A is not reported as one line: da = depreciation + amortization (flagged da_composed)
depreciation: [Depreciation]
amortization: [AmortizationOfIntangibleAssets, AmortizationOfDeferredCharges]
sbc: [ShareBasedCompensation, AllocatedShareBasedCompensationExpense]
interest_expense: [InterestExpense, InterestExpenseNonoperating, InterestExpenseDebt]
total_assets: [Assets]
total_liabilities: [Liabilities]
equity: [StockholdersEquity, StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]
cash: [CashAndCashEquivalentsAtCarryingValue, CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents]
short_term_debt: [LongTermDebtCurrent, LongTermDebtAndCapitalLeaseObligationsCurrent, DebtCurrent, ShortTermBorrowings]
long_term_debt: [LongTermDebtNoncurrent, LongTermDebtAndCapitalLeaseObligations]
# used only when no noncurrent-specific tag exists; these tags include the current portion (flag debt_total_tag)
total_debt_reported: [DebtAndCapitalLeaseObligations, LongTermDebt, DebtLongtermAndShorttermCombinedAmount]
goodwill: [Goodwill]
intangibles: [IntangibleAssetsNetExcludingGoodwill]
current_assets: [AssetsCurrent]
current_liabilities: [LiabilitiesCurrent]
dividends_paid: [PaymentsOfDividendsCommonStock, PaymentsOfDividends]
buybacks: [PaymentsForRepurchaseOfCommonStock]
share_issuance: [ProceedsFromIssuanceOfCommonStock]
acquisitions: [PaymentsToAcquireBusinessesNetOfCashAcquired]
# share-count fallback for multi-class filers (cover-page dei shares are dimensioned and absent from companyfacts)
diluted_shares: [WeightedAverageNumberOfDilutedSharesOutstanding]
